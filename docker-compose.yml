version: "3.9"

services:
  postgres:
    image: postgres:14-alpine
    container_name: diarygo_postgres
    environment:
      POSTGRES_DB: diarygo
      POSTGRES_USER: diarygo
      POSTGRES_PASSWORD: diarygo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diarygo"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: diarygo_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@diarygo.com.br
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  flyway:
    image: flyway/flyway:10-alpine
    container_name: diarygo_flyway
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/diarygo
      FLYWAY_USER: diarygo
      FLYWAY_PASSWORD: diarygo
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./migrations:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
